<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixpack 60 Hari</title>
<meta name="description" content="Jadwal 60 hari menuju sixpack: menu warteg murah, program gym, checklist harian, dan catatan berat badan.">
<meta name="theme-color" content="#E8EDF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#03050A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sixpack 60">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
</head>
<body>
<!-- app:start -->
<div class="ambient" aria-hidden="true"></div>
<header class="navbar" id="navbar">
  <div class="navbar-inner">
    <span class="nav-title" id="navTitle">Hari Ini</span>
    <button class="sync" id="sync" type="button" data-s="local" data-act="syncChip" aria-label="Status penyimpanan"><i></i></button>
  </div>
</header>
<main class="view" id="view"></main>
<nav class="tabbar" id="tabbar" aria-label="Menu utama"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet-backdrop" id="pinSheet" hidden>
  <form class="sheet glass" data-form="pin" role="dialog" aria-modal="true" aria-labelledby="pinTitle" novalidate>
    <h2 class="section-title" id="pinTitle">Masukkan PIN</h2>
    <p class="tip">Data kamu tersimpan di database. Masukkan PIN yang diatur di Vercel (APP_PIN). Cukup sekali per HP.</p>
    <input class="field-input pin-input" id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" aria-label="PIN">
    <p class="error" id="pinErr"></p>
    <button class="btn block" id="pinSubmit" type="submit">Buka</button>
    <button class="btn plain block" type="button" data-act="pinLater">Nanti saja, simpan di HP dulu</button>
  </form>
</div>
<!-- app:end -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
